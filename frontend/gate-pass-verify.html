<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a2e">
  <meta name="robots" content="noindex,nofollow">
  <title>Gate Pass Verification</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#123c63 0,#071a2e 48%,#020814 100%);color:#0f172a;display:flex;align-items:center;justify-content:center;padding:18px}
    .card{width:min(440px,100%);background:#fff;border-radius:28px;box-shadow:0 24px 70px rgba(0,0,0,.38);overflow:hidden}.head{padding:22px 22px 18px;background:linear-gradient(135deg,#075985,#0c4a6e 55%,#0f766e);color:#fff}.brand{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.9}.title{font-size:24px;font-weight:950;margin:7px 0 2px}.sub{font-size:12px;opacity:.82}.body{padding:22px}.state{border-radius:18px;padding:15px;text-align:center;font-weight:900;font-size:15px}.checking{background:#eff6ff;color:#1d4ed8}.valid{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}.invalid{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.warn{background:#fffbeb;color:#b45309;border:1px solid #fde68a}.spinner{display:inline-block;width:16px;height:16px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.photo{width:104px;height:104px;object-fit:cover;border-radius:22px;border:3px solid #10b981;display:block;margin:16px auto 7px}.sig{max-height:56px;max-width:190px;display:block;margin:5px auto 14px;border:1px solid #e2e8f0;border-radius:10px;padding:4px}.name{text-align:center;font-size:18px;font-weight:950;margin-top:12px}.roll{text-align:center;color:#64748b;font-size:11px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:10px}.label{font-size:9px;color:#94a3b8;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.value{font-size:12px;font-weight:800;color:#1e293b;margin-top:3px;word-break:break-word}.foot{margin-top:17px;text-align:center;font-size:10px;color:#64748b;line-height:1.5}.danger{color:#be123c;font-weight:900}.btn{display:block;width:100%;border:0;border-radius:14px;padding:12px;background:#e2e8f0;color:#334155;font-weight:900;margin-top:16px;cursor:pointer}.tiny{font-size:10px;color:#94a3b8;text-align:center;margin-top:12px}
  </style></head>
<body>
  <main class="card" aria-live="polite">
    <header class="head">
      <div class="brand">Narayana Engineering College · Nellore</div>
      <div class="title">Gate Pass Verification</div>
      <div class="sub">Secure one-time digital out-pass</div>
    </header>
    <section class="body" id="app">
      <div class="state checking"><span class="spinner"></span>Verifying with the central server…</div>
      <div class="tiny">Do not admit the student until this page shows VALID.</div>
    </section>
  </main>
<script>
(function(){
  'use strict';
  const app=document.getElementById('app');
  const params=new URLSearchParams(location.search);
  let id=params.get('id'), token=params.get('token');
  if((!id||!token)&&params.get('verifyGatePass')){const raw=params.get('verifyGatePass').split(':');id=raw.shift();token=raw.join(':');}
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=v=>v?esc(v):'—';
  const renderState=(cls,title,body)=>{app.innerHTML='<div class="state '+cls+'">'+title+'</div>'+body;};
  const renderInvalid=(reason,extra)=>{
    let title='❌ INVALID QR CODE',body='This QR code does not match an approved gate pass.';
    if(reason==='already_used'){title='❌ ALREADY USED — EXPIRED';body='This pass was already scanned and is permanently expired on every device.';}
    else if(reason==='not_approved'){title='⚠ NOT APPROVED';body='This gate pass has not completed the required approval process.';}
    else if(reason==='expired'){title='❌ EXPIRED';body='This gate pass has expired and cannot be admitted.';}
    else if(reason==='offline'){title='⚠ COULD NOT VERIFY';body='The central server could not be reached. Do NOT admit the student. Check Internet access and retry.';}
    else if(reason==='error'){title='⚠ VERIFICATION ERROR';body='The central server could not confirm this pass. Do NOT admit the student.';}
    renderState(reason==='not_approved'?'warn':'invalid',title,'<p class="foot">'+body+'</p>'+(extra?'<p class="tiny">'+esc(extra)+'</p>':'')+'<button class="btn" onclick="location.reload()">Verify Again</button>');
  };
  const renderValid=p=>{
    p=p||{};
    const photo=p.studentPhoto?'<img class="photo" src="'+esc(p.studentPhoto)+'" alt="Student photo">':'';
    const sig=p.studentSignature?'<img class="sig" src="'+esc(p.studentSignature)+'" alt="Student signature">':'';
    app.innerHTML='<div class="state valid">✓ VALID — PASS ACCEPTED</div>'+photo+sig+
      '<div class="name">'+fmt(p.studentName)+'</div><div class="roll">'+fmt(p.rollNo)+'</div>'+
      '<div class="grid"><div class="item"><div class="label">Branch</div><div class="value">'+fmt(p.branch)+'</div></div>'+
      '<div class="item"><div class="label">Destination</div><div class="value">'+fmt(p.destination)+'</div></div>'+
      '<div class="item"><div class="label">Departure</div><div class="value">'+fmt((p.outDate||'')+' '+(p.outTime||''))+'</div></div>'+
      '<div class="item"><div class="label">Return</div><div class="value">'+fmt((p.returnDate||'')+' '+(p.returnTime||''))+'</div></div>'+
      '<div class="item"><div class="label">Approved by</div><div class="value">'+fmt(p.decidedBy)+'</div></div>'+
      '<div class="item"><div class="label">Approved at</div><div class="value">'+fmt(p.decidedAt)+'</div></div></div>'+
      '<p class="foot">Server recorded at <strong>'+fmt(p.qrUsedAt)+'</strong>.<br><span class="danger">This QR is now expired globally and cannot be accepted again.</span></p>';
  };
  async function verify(){
    if(!id||!token){renderInvalid('invalid');return;}
    try{
      const base=(window.TNP_BACKEND_URL||location.origin).replace(/\/+$/,'');
      const res=await fetch(base+'/api/gate-passes/public/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:Number(id),token})});
      const data=await res.json().catch(()=>null);
      if(!res.ok||!data){renderInvalid('error');return;}
      if(data.status==='ok'){renderValid(data.pass||data);return;}
      renderInvalid(data.status,data.pass&&data.pass.qrUsedAt?('Already scanned at '+data.pass.qrUsedAt):'');
    }catch(e){renderInvalid('offline',e&&e.message);}
  }
  verify();
})();</script>
</body>
</html>
